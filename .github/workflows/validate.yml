name: validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify checksums
        run: sha256sum -c SHA256SUMS

      - name: Validate eggs
        run: python3 scripts/validate.py
